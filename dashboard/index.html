<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>revel8 operator console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* Operator-console identity: scan-first dashboard. Signal-blue accent for flow/interaction,
     semantic red for incident. Cool blue-biased slate neutrals. Space Grotesk / Inter / JetBrains Mono. */
  :root{
    --bg:#f5f6f9; --surface:#fbfcfe; --panel:#ffffff;
    --line:#e3e6ef; --line-2:#d3d8e4;
    --fg:#0f1220; --muted:#5e6378; --faint:#eef1f7;
    --accent:#2f54ff; --accent-ink:#1a3bd6; --accent-weak:#e7ecff;
    --crit:#d1352f; --crit-weak:#fbe9e8;
    --font-display:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#080a10; --surface:#0e111a; --panel:#121622;
      --line:#232838; --line-2:#323a4f;
      --fg:#e9ecf5; --muted:#949bb2; --faint:#161b28;
      --accent:#6684ff; --accent-ink:#9fb2ff; --accent-weak:#1a2140;
      --crit:#ff5d58; --crit-weak:#2b1618;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#080a10; --surface:#0e111a; --panel:#121622;
    --line:#232838; --line-2:#323a4f;
    --fg:#e9ecf5; --muted:#949bb2; --faint:#161b28;
    --accent:#6684ff; --accent-ink:#9fb2ff; --accent-weak:#1a2140;
    --crit:#ff5d58; --crit-weak:#2b1618;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  a{color:var(--accent-ink)}
  .wrap{max-width:1200px;margin:0 auto;
    padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
    padding-bottom:72px}

  /* header / status bar */
  header{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:saturate(1.3) blur(8px);position:sticky;top:env(safe-area-inset-top,0px);z-index:8}
  .hd{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:15px max(20px,env(safe-area-inset-right,0px)) 15px max(20px,env(safe-area-inset-left,0px))}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand .mk{width:13px;height:13px;border-radius:4px;background:var(--accent);align-self:center;
    box-shadow:0 0 0 3px var(--accent-weak)}
  .brand b{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.02em}
  .brand span{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;
    padding:6px 11px;font-family:var(--font-mono);font-size:12px;color:var(--muted);background:var(--panel)}
  .chip b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
  .chip svg{width:14px;height:14px;opacity:.8}
  .chip .hit{color:var(--crit)}
  .ib{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);
    border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;transition:border-color .15s,color .15s}
  .ib:hover{border-color:var(--accent);color:var(--accent)}
  .ib svg{width:17px;height:17px}

  /* section eyebrow */
  h2{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:36px 0 13px;display:flex;align-items:center;gap:9px}
  h2::before{content:"";width:16px;height:2px;background:var(--accent);border-radius:2px}

  /* target rail */
  .rail{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
  .tcard{border:1px solid var(--line);border-radius:14px;padding:17px 18px;background:var(--panel);
    cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s;text-align:left;font:inherit;color:inherit}
  .tcard:hover{transform:translateY(-1px);box-shadow:0 6px 20px -14px rgba(20,28,60,.4)}
  .tcard[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .tcard .nm{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tcard .nm span{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-.01em}
  .tcard .ob{color:var(--muted);font-family:var(--font-mono);font-size:11.5px;margin-top:4px;
    text-transform:uppercase;letter-spacing:.05em}
  .badge{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    padding:4px 9px;border-radius:7px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .badge svg{width:13px;height:13px}
  .b-win{background:var(--crit);color:#fff}
  .b-held{background:transparent;color:var(--muted);border:1px solid var(--line-2)}

  /* layout */
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
  @media(max-width:920px){.grid{grid-template-columns:1fr}.rail{grid-template-columns:1fr}}
  .panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;margin-bottom:22px}
  .panel .ph{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:-.005em}
  .panel .ph svg{width:16px;height:16px;color:var(--accent);flex:none}
  .panel .ph .sp{margin-left:auto;font-family:var(--font-mono);font-weight:400;font-size:11.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .pb{padding:17px}
  .fold>summary{list-style:none;cursor:pointer}
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:12px}
  .fold[open]>summary::after{transform:rotate(45deg)}
  .fold>summary:hover{background:var(--surface)}

  /* agent graph — orchestrator hub */
  #graph{width:100%;height:auto;display:block;background:
    radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--line) 70%,transparent) 1px, transparent 0) 0 0/26px 26px}
  .node rect{fill:var(--panel);stroke:var(--line-2);stroke-width:1.4;transition:stroke .2s}
  .node .ttl{font-family:var(--font-display);font-weight:600;font-size:14px;fill:var(--fg)}
  .node .rl{font-family:var(--font-mono);font-size:9.5px;fill:var(--muted)}
  .node.on rect{stroke:var(--accent);stroke-width:2.4}
  .node.active{animation:blink 1.1s ease-in-out infinite}
  /* orchestrator: always the visual lead in the centre */
  .orch rect{fill:var(--accent-weak);stroke:var(--accent);stroke-width:2.2}
  .orch .ttl{font-family:var(--font-display);font-weight:700;font-size:20px;fill:var(--accent-ink);letter-spacing:-.01em}
  .orch .rl{font-family:var(--font-mono);font-size:10.5px;fill:var(--accent-ink);opacity:.75}
  .orch.active{animation:none}
  .orch.on rect{stroke-width:3;filter:drop-shadow(0 0 13px var(--accent))}
  @keyframes blink{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 12px var(--accent))}}
  .edge{stroke:var(--line-2);stroke-width:1.5;fill:none;transition:stroke .2s}
  .edge.api{stroke-dasharray:6 5}
  .edge.on{stroke:var(--accent);stroke-width:2.8}
  .pulse{fill:var(--accent)}
  .pulse.api{fill:var(--accent-ink)}
  .elabel{font-family:var(--font-mono);font-size:10px;fill:var(--muted)}
  .legend{display:flex;gap:18px;flex-wrap:wrap;padding:13px 17px;border-top:1px solid var(--line);
    font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:16px;height:0;border-top:2px solid var(--accent);display:inline-block}
  .legend i.dash{border-top-style:dashed}
  #stageline{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--accent-ink)}

  /* recon sources */
  .srcs{display:flex;flex-direction:column}
  .src{display:flex;align-items:center;gap:12px;padding:12px 17px;border-bottom:1px solid var(--line)}
  .src:last-child{border-bottom:0}
  .src .seq{font-family:var(--font-mono);font-size:11px;color:var(--muted);width:14px;text-align:center;flex:none}
  .src .ic{width:31px;height:31px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
  .src.first .ic{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
  .src .ic svg{width:16px;height:16px}
  .src .dm{font-family:var(--font-mono);font-weight:500;font-size:13px}
  .src .kd{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
  .src .ct{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted);
    border:1px solid var(--line);border-radius:7px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* knowledge graph */
  #kg{width:100%;height:auto;display:block;padding:6px 8px}
  .kg-center rect{fill:var(--accent-weak);stroke:var(--accent);stroke-width:1.8}
  .kg-center text{font-family:var(--font-display);font-weight:600;font-size:13px;fill:var(--fg)}
  .kg-node{cursor:help}
  .kg-node rect{fill:var(--panel);stroke:var(--line-2);stroke-width:1.3;transition:stroke .15s,filter .15s}
  .kg-node.cited rect{stroke:var(--accent);stroke-width:1.8}
  .kg-node:hover rect{stroke:var(--accent);stroke-width:2.2;filter:drop-shadow(0 4px 12px rgba(20,28,60,.18))}
  .kg-node .cat{font-family:var(--font-mono);font-weight:600;font-size:8px;fill:var(--muted);letter-spacing:.08em}
  .kg-node.cited .cat{fill:var(--accent-ink)}
  .kg-node .fx{font-family:var(--font-body);font-size:11px;fill:var(--fg)}
  .kg-edge{stroke:var(--accent);fill:none}
  /* knowledge-graph hover detail */
  #kgtip{position:fixed;z-index:30;max-width:340px;pointer-events:none;opacity:0;transform:translateY(5px);
    transition:opacity .12s,transform .12s;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;
    box-shadow:0 16px 40px -14px rgba(16,20,40,.55);padding:13px 15px}
  #kgtip.on{opacity:1;transform:none}
  #kgtip .fact{font-family:var(--font-body);font-size:13.5px;line-height:1.5;color:var(--fg);margin-bottom:9px}
  #kgtip pre{margin:0;white-space:pre-wrap;font-family:var(--font-mono);font-size:11px;line-height:1.55;color:var(--muted);
    border-top:1px solid var(--line);padding-top:9px}
  #kgtip pre b{color:var(--accent-ink);font-weight:600}

  /* targeting */
  .ring{display:flex;align-items:center;gap:17px}
  .ring svg{width:92px;height:92px;flex:none}
  .ring .pct{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ring .cap{color:var(--muted);font-size:12px;margin-top:2px}
  .kv{margin-top:16px;display:grid;gap:11px}
  .kv .row{display:grid;grid-template-columns:76px 1fr;gap:12px;font-size:13.5px;align-items:start}
  .kv .row b{color:var(--muted);font-weight:500;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;
    letter-spacing:.05em;padding-top:2px}
  .relbars{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
  .relbars .r{font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);
    border-radius:7px;padding:3px 9px;font-variant-numeric:tabular-nums}

  /* message thread */
  .thread{display:flex;flex-direction:column}
  .msg{padding:15px 0;border-top:1px solid var(--line);min-width:0}
  .msg:first-child{border-top:0}
  .mhead{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-family:var(--font-mono);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.05em;color:var(--muted);flex-wrap:wrap}
  .role{font-weight:600;padding:2px 8px;border-radius:6px}
  .role.op{color:var(--accent-ink);background:var(--accent-weak)}
  .role.tw{color:var(--muted);background:var(--faint)}
  .msg .ch{border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--fg)}
  .msg .subj{font-family:var(--font-display);font-weight:600;font-size:14px;margin-bottom:6px}
  .msg .bd{white-space:pre-wrap;font-size:13.5px;overflow-wrap:anywhere}
  .msg .bd.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .more{margin-top:7px;font-family:var(--font-mono);font-size:11px;color:var(--accent-ink);cursor:pointer;
    background:none;border:0;padding:0}
  .mailtag{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-bottom:6px;
    display:inline-flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.05em}
  .mailtag svg{width:12px;height:12px}
  .mailframe{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;height:120px;max-height:220px;display:block}
  .plan{align-self:center;font-family:var(--font-mono);font-size:11px;color:var(--muted);display:inline-flex;
    align-items:center;gap:8px;border:1px dashed var(--line-2);border-radius:8px;padding:5px 12px;max-width:93%}
  .plan svg{width:13px;height:13px;color:var(--accent);flex:none}
  .plan b{color:var(--fg);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:10px}
  .silence{color:var(--muted);font-size:12.5px;font-style:italic;padding:6px 0}
  .why{align-self:center;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);opacity:.82;padding:6px 0 2px;letter-spacing:.02em;max-width:93%}
  .incrow{align-self:center;font-family:var(--font-mono);font-size:11px;color:var(--crit);font-weight:600;padding:6px 0}
  .plan.stop b{color:var(--crit)} .plan.continue b{color:var(--accent)}
  .thread{max-height:600px;overflow:auto}

  /* message tabs */
  .tabrow{display:flex;gap:3px;padding:7px 8px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{flex:1;min-width:0;appearance:none;background:none;border:0;cursor:pointer;color:var(--muted);
    font-family:var(--font-display);font-weight:600;font-size:13px;padding:9px 10px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .15s,color .15s}
  .tab:hover{background:var(--surface)}
  .tab[aria-selected="true"]{background:var(--accent-weak);color:var(--accent-ink)}
  .tab .st{width:7px;height:7px;border-radius:50%;flex:none}
  .tab .st.win{background:var(--crit)}
  .tab .st.held{background:var(--line-2)}

  /* animation */
  @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes kgPop{from{opacity:0}to{opacity:1}}
  .thread>*{animation:fadeUp .34s ease both}
  .kg-node,.kg-edge{animation:kgPop .42s ease both}
  @media (prefers-reduced-motion:reduce){.thread>*,.kg-node,.kg-edge{animation:none!important}}

  /* sweep table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line)}
  th{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  td{font-variant-numeric:tabular-nums}
  .dotok{width:7px;height:7px;border-radius:50%;background:var(--crit);display:inline-block}
  .dotno{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:inline-block}
  .cap{color:var(--muted);text-transform:capitalize}

  /* outcome */
  .ocard .sub{margin-top:11px;color:var(--muted);font-size:13px;line-height:1.5}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  footer{color:var(--muted);font-family:var(--font-mono);font-size:11px;line-height:1.7;margin-top:44px;
    border-top:1px solid var(--line);padding-top:18px;letter-spacing:.02em}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><span class="mk"></span><b>revel8</b><span>operator&nbsp;console</span></div>
    <div class="chips">
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/><path d="M4 10h-2M4 14h-2M22 10h-2M22 14h-2M10 4V2M14 4V2M10 22v-2M14 22v-2"/></svg><b id="model">—</b></span>
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 6v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V6z"/><path d="M9 12l2 2 4-4"/></svg><b id="score" class="hit">—</b>&nbsp;compromised</span>
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="time">—</span></span>
      <button class="ib" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid">
    <div>
      <div class="panel">
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.3 7 10 11M7.3 17 10 13M14 11l3-3.5M14 13l3 3.5"/></svg>
          Agent network
          <button class="ib sp" id="replay" title="Replay the run" aria-label="Replay the run" style="margin-left:auto;padding:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg></button>
        </div>
        <svg id="graph" viewBox="0 0 1000 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Agent pipeline network"></svg>
        <div class="legend"><span><i></i> flow</span><span><i class="dash"></i> API call → Personal Interface</span><span id="stageline"></span></div>
      </div>

      <div class="panel">
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="5" r="2.5"/><circle cx="17" cy="17" r="2.5"/><circle cx="7" cy="18" r="2.5"/><path d="M8 7l8-1M8.5 17l7-1M6.5 8.4 6.8 15.5M8 6.4 16 16"/></svg>Knowledge graph<span class="sp" id="kgn"></span></div>
        <svg id="kg" viewBox="0 0 760 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Knowledge graph"></svg>
      </div>
    </div>

    <div>
      <div class="panel">
        <div class="tabrow" id="tabs" role="tablist"></div>
        <div class="pb thread" id="thread"></div>
      </div>

      <div class="panel">
        <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>Targeting decision</div>
        <div class="pb">
          <div class="ring"><svg viewBox="0 0 80 80" id="ring"></svg>

    const mid=el("div");mid.appendChild(el("div","dm",s.domain));mid.appendChild(el("div","kd",s.kind+(s.channel?" · "+s.channel:"")));row.appendChild(mid);
    row.appendChild(el("span","ct",s.count+" cited"));host.appendChild(row);
  });
}

function wrap(text,max,maxLines){const ml=maxLines||3;const words=(text||"").split(" "),lines=[];let cur="";
  for(const w of words){if((cur+" "+w).trim().length>max){if(cur)lines.push(cur);cur=w;}else cur=(cur+" "+w).trim();}
  if(cur)lines.push(cur);
  if(lines.length>ml){const o=lines.slice(0,ml);o[ml-1]=o[ml-1].slice(0,max-1).replace(/\s+\S*$/,"").trim()+"…";return o;}
  return lines;}

// hover detail — the raw fact as JSON
let kgtip;
function ensureTip(){if(!kgtip){kgtip=el("div");kgtip.id="kgtip";document.body.appendChild(kgtip);}return kgtip;}
function showTip(e,n){const tp=ensureTip();tp.innerHTML="";
  tp.appendChild(el("div","fact",n.label));
  const raw={id:n.id,category:n.category,reliability:n.reliability,domain:n.domain,cited:n.cited};
  const pre=el("pre");
  pre.innerHTML=JSON.stringify(raw,null,2).replace(/"(reliability|cited|domain)":/g,'<b>"$1":</b>');
  tp.appendChild(pre);tp.classList.add("on");moveTip(e);}
function moveTip(e){if(!kgtip)return;const pad=16,w=kgtip.offsetWidth||320,h=kgtip.offsetHeight||150;
  let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>innerWidth-8)x=e.clientX-w-pad;
  if(y+h>innerHeight-8)y=e.clientY-h-pad;
  kgtip.style.left=Math.max(8,x)+"px";kgtip.style.top=Math.max(8,y)+"px";}
function hideTip(){if(kgtip)kgtip.classList.remove("on");}

function renderKG(t){
  const svg=$("#kg");svg.innerHTML="";hideTip();const nodes=t.knowledge||[];
  $("#kgn").textContent=nodes.length?nodes.length+" key facts · hover for detail":"";
  const W=760,H=520,cx=W/2,cy=H/2;
  if(!nodes.length){const tx=S("text",{x:cx,y:cy,"text-anchor":"middle",class:"elabel"});tx.textContent="No knowledge graph for this run.";svg.appendChild(tx);return;}
  const relOp={belastbar:1,unsicher:.55,unbelastbar:.3},n=nodes.length,rx=252,ry=168,nw=192;
  nodes.forEach((nd,i)=>{const a=(-90+i*(360/n))*Math.PI/180;const x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);
    const ln=S("line",{class:"kg-edge",x1:cx,y1:cy,x2:x,y2:y,"stroke-width":nd.cited?2.4:1.3,"stroke-opacity":(relOp[nd.reliability]||.5)});ln.style.animationDelay=(i*0.04)+"s";svg.appendChild(ln);});
  nodes.forEach((nd,i)=>{const a=(-90+i*(360/n))*Math.PI/180;const x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);
    const lines=wrap(nd.label,30,4),nh=18+lines.length*13+9;
    const g=S("g",{class:"kg-node"+(nd.cited?" cited":""),transform:`translate(${x-nw/2},${y-nh/2})`});
    g.style.animationDelay=(0.12+i*0.05)+"s";
    g.appendChild(S("rect",{width:nw,height:nh,rx:11}));
    const cat=S("text",{class:"cat",x:12,y:17});cat.textContent=(nd.category||"").toUpperCase()+(nd.cited?" · USED":"");g.appendChild(cat);
    lines.forEach((ln,li)=>{const tx=S("text",{class:"fx",x:12,y:33+li*13});tx.textContent=ln;g.appendChild(tx);});
    g.addEventListener("mouseenter",e=>showTip(e,nd));
    g.addEventListener("mousemove",moveTip);
    g.addEventListener("mouseleave",hideTip);
    svg.appendChild(g);});
  const c=S("g",{class:"kg-center",transform:`translate(${cx-74},${cy-24})`});
  c.appendChild(S("rect",{width:148,height:48,rx:12}));
  const ct=S("text",{x:74,y:29,"text-anchor":"middle"});ct.textContent=t.name;c.appendChild(ct);
  svg.appendChild(c);
}

let lastPct=null;
function drawRing(pct){const svg=$("#ring");svg.innerHTML="";const accent=cssv("--accent")||"#2f54ff",line=cssv("--line-2")||"#d3d8e4";
  const r=32,c=2*Math.PI*r;svg.appendChild(S("circle",{cx:40,cy:40,r,fill:"none",stroke:line,"stroke-width":8}));
  if(pct!=null)svg.appendChild(S("circle",{cx:40,cy:40,r,fill:"none",stroke:accent,"stroke-width":8,"stroke-linecap":"round","stroke-dasharray":c,"stroke-dashoffset":c*(1-pct/100),transform:"rotate(-90 40 40)"}));}
function renderHook(t){
  const kv=$("#hookkv");kv.innerHTML="";
  [["Angle",t.hook.topic],["Why now",t.hook.why_now],["Channel",t.hook.channel],["Objective",t.objective]].forEach(([k,v])=>{
    if(!v)return;const row=el("div","row");row.appendChild(el("b",null,k));row.appendChild(el("span",null,v));kv.appendChild(row);});
  const alts=(t.alternatives||[]).map(a=>a.topic).filter(Boolean);
  if(alts.length){const row=el("div","row");row.appendChild(el("b",null,"Alternatives"));
    const s=el("span",null,alts.join(" · "));s.title="Ranked hooks the targeter weighed but did not choose";row.appendChild(s);kv.appendChild(row);}
  const bars=$("#relbars");bars.innerHTML="";
  if(t.score){lastPct=t.score.percent;drawRing(t.score.percent);$("#ringpct").textContent=t.score.percent+"%";
    for(const [rel,n] of Object.entries(t.score.breakdown))bars.appendChild(el("span","r",`${n} ${rel}`));
    bars.appendChild(el("span","r",`${t.score.evidence_count} cited facts`));}
  else{lastPct=null;drawRing(null);$("#ringpct").textContent="—";bars.appendChild(el("span","r","no scored evidence in this run"));}
}
const PLAN={continue:"continue",switch:"switch angle",stop:"stop",escalate:"escalate"};
const looksHTML=s=>/<(!doctype|html|div|p\b|a\b|table|body|br|span|strong)/i.test(s||"");
function appendBody(host,body,channel){
  if(looksHTML(body)){
    const tag=el("div","mailtag");tag.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>rendered HTML email';
    host.appendChild(tag);
    const f=el("iframe","mailframe");f.setAttribute("sandbox","");f.setAttribute("srcdoc",body);f.setAttribute("title","phishing email");
    f.onload=()=>{try{const h=f.contentDocument.body.scrollHeight;f.style.height=Math.min(Math.max(h+10,80),220)+"px";}catch(e){f.style.height="200px";}};
    host.appendChild(f);
  }else{
    const bd=el("div","bd clamp");bd.textContent=body;host.appendChild(bd);
    if((body||"").length>300){const btn=el("button","more","show more");
      btn.onclick=()=>{btn.textContent=bd.classList.toggle("clamp")?"show more":"show less";};
      host.appendChild(btn);}
  }
}
function renderThread(t){
  const box=$("#thread");box.innerHTML="";const touches=t.thread||[];
  if(!touches.length&&(!t.call||!t.call.length)){box.appendChild(el("div","empty","No thread recorded for this run."));return;}
  const entry=(roleCls,roleTxt,bits,subject,body)=>{
    const m=el("div","msg"),h=el("div","mhead");
    h.appendChild(el("span","role "+roleCls,roleTxt));
    bits.forEach(b=>{if(b&&b.t)h.appendChild(el("span",b.ch?"ch":null,b.t));});
    m.appendChild(h);
    if(subject)m.appendChild(el("div","subj",subject));
    appendBody(m,body||"");box.appendChild(m);
  };
  touches.forEach((m,i)=>{
    if(m.sent_because){const w=el("div","why");w.textContent="▸ "+m.sent_because;box.appendChild(w);}
    entry("op","Operator",[{ch:1,t:m.channel||"msg"},{t:"touch "+(m.touch||i+1)},{t:m.from_name||""}],m.subject,m.body);
    if(m.reply)entry("tw",t.name,m.gate?[{t:"reply"},{t:m.gate}]:[{t:"reply"}],null,m.reply);
    else box.appendChild(el("div","silence",t.name+" stayed silent"));
    const d=m.decision;
    if(d){const p=el("div","plan "+(d.action||""));
      p.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="3"/></svg>';
      p.appendChild(el("b",null,(PLAN[d.action]||d.action||"").toUpperCase()));
      if(d.reason){const g=el("span");g.textContent=d.reason.length>120?d.reason.slice(0,119)+"…":d.reason;g.title=d.reason;p.appendChild(g);}box.appendChild(p);}
    if(m.incident){box.appendChild(el("div","incrow","⚑ incident — "+(m.incident.type||"reached")));}
  });
  (t.call||[]).forEach((turn,i)=>{if(i===0){const h=el("div","plan");h.appendChild(el("b",null,"voice call"));box.appendChild(h);}
    entry("op","Operator",[{t:"call"}],null,turn.us);
    entry("tw",t.name,[{t:"reply"}],null,turn.them);});
  [...box.children].forEach((c,i)=>{c.style.animationDelay=(i*0.05)+"s";});
}
function renderSweep(t){
  const host=$("#sweep");host.innerHTML="";const rows=t.sweep||[];$("#sweepn").textContent=rows.length?rows.length+" tactics":"";
  if(!rows.length){const e=el("div","empty","No sweep recorded.");e.style.padding="16px";host.appendChild(e);return;}
  const tbl=el("table");tbl.innerHTML="<thead><tr><th>Tactic</th><th>Lever</th><th>Channel</th><th>Result</th></tr></thead>";
  const tb=el("tbody");
  rows.forEach(r=>{const tr=el("tr");
    tr.appendChild(el("td",null,(r.tactic||"").replace(/_/g," ")));
    tr.appendChild(el("td","cap",r.lever||""));tr.appendChild(el("td","cap",(r.channel||"").replace(/_/g," ")));
    const td=el("td");td.appendChild(el("span",r.incident?"dotok":"dotno"));
    const lab=el("span");lab.style.marginLeft="8px";lab.textContent=r.incident?"incident":(r.best||"silence");
    if(r.incident){lab.style.color="var(--crit)";lab.style.fontWeight="600";}else lab.className="cap";
    td.appendChild(lab);tr.appendChild(td);tb.appendChild(tr);});
  tbl.appendChild(tb);host.appendChild(tbl);
}
function renderOutcome(t){
  const o=$("#outcome");o.innerHTML="";const win=t.outcome.compromised;
  const b=el("span","badge "+(win?"b-win":"b-held"));
  b.innerHTML=win?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>objective reached'
    :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>target held';
  o.appendChild(b);
  const p=el("div","sub");
  if(win){p.textContent="Reached"+(t.outcome.touches_to_incident?" at touch "+t.outcome.touches_to_incident:"")
      +" — a secret was submitted or an internal fact disclosed. Verify against the twin's replies above.";}
  else{p.textContent=(t.outcome.stop_reason?t.outcome.stop_reason+". ":"No incident across "+(t.outcome.touches||0)+" touches. ")
      +"The twin gated on sender verifiability and routed to its team; the agent reassessed and stopped rather than burn budget — the honest outcome against a hardened human firewall.";}
  o.appendChild(p);
}

let selected=null;
function select(t){selected=t;
  document.querySelectorAll(".tab").forEach(c=>c.setAttribute("aria-selected",c.dataset.id===t.id));
  renderSources(t);renderKG(t);renderHook(t);renderThread(t);renderSweep(t);renderOutcome(t);replay(t);}
function renderTabs(){const host=$("#tabs");host.innerHTML="";
  (DATA.targets||[]).forEach(t=>{const b=el("button","tab");b.dataset.id=t.id;b.setAttribute("role","tab");b.setAttribute("aria-selected","false");
    b.appendChild(el("span","st "+(t.outcome.compromised?"win":"held")));
    b.appendChild(el("span",null,t.name));b.title=(t.hook.channel?t.hook.channel+" · ":"")+t.objective;
    b.onclick=()=>select(t);host.appendChild(b);});}
function boot(){
  $("#model").textContent=DATA.model||"model";const s=DATA.summary||{};
  $("#score").textContent=(s.compromised??0)+" / "+(s.targets_total??0);
  if(DATA.generated_at){try{$("#time").textContent=new Date(DATA.generated_at).toLocaleString();}catch(e){$("#time").textContent=DATA.generated_at;}}
  $("#foot").textContent=(DATA.scenario||"")+" — privacy-safe export of real Target-API sessions. Source domains and public professional facts only; raw OSINT stays local.";
  buildGraph();renderTabs();
  if((DATA.targets||[]).length)select(DATA.targets.find(t=>t.outcome.compromised)||DATA.targets[0]);
  else $("#stageline").textContent="No run data — run scripts/build_dashboard_data.py";
}
$("#replay").onclick=()=>{if(selected)replay(selected);};
boot();
</script>

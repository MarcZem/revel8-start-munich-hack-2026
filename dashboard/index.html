<script>
"use strict";
const DATA = (() => { try { return JSON.parse(document.getElementById("run-data").textContent); }
  catch (e) { return {}; } })();

const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const svgNS = "http://www.w3.org/2000/svg";
const S = (t, a) => { const n = document.createElementNS(svgNS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };

// ---- theme ----
$("#theme").onclick = () => {
  const r = document.documentElement;
  const cur = r.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  r.setAttribute("data-theme", next);
  try { localStorage.setItem("r8theme", next); } catch (e) {}
  drawRing(lastPct);
};
try { const t = localStorage.getItem("r8theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}

// ---- graph layout ----
const NODES = {
  research: [130, 110], ranker: [130, 330], targeter: [360, 220],
  writer: [600, 120], critic: [600, 330], twin: [860, 220],
};
const NW = 150, NH = 52;
const EDGES = [
  ["research", "ranker"], ["research", "targeter"], ["ranker", "targeter"],
  ["targeter", "writer"], ["writer", "twin", "api"], ["twin", "critic"], ["critic", "writer"],
];
const cx = id => NODES[id][0], cy = id => NODES[id][1];
const graph = $("#graph");
let nodeEls = {}, edgeEls = {};

function buildGraph() {
  graph.innerHTML = "";
  const meta = Object.fromEntries((DATA.pipeline || []).map(p => [p.id, p]));
  for (const [a, b, kind] of EDGES) {
    const x1 = cx(a), y1 = cy(a), x2 = cx(b), y2 = cy(b);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 26;
    const path = S("path", { class: "edge" + (kind ? " api" : ""), d: `M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}` });
    graph.appendChild(path);
    edgeEls[a + ">" + b] = path;
    if (kind === "api") {
      const t = S("text", { class: "elabel", x: mx, y: my - 4, "text-anchor": "middle" });
      t.textContent = "API call"; graph.appendChild(t);
    }
  }
  for (const id in NODES) {
    const [x, y] = NODES[id];
    const g = S("g", { class: "node" + (id === "twin" ? " hub" : ""), transform: `translate(${x - NW / 2},${y - NH / 2})` });
    g.appendChild(S("rect", { width: NW, height: NH, rx: 12 }));
    const label = S("text", { class: "ttl", x: NW / 2, y: NH / 2 - 2, "text-anchor": "middle" });
    label.textContent = (meta[id] && meta[id].label) || id;
    g.appendChild(label);
    const role = S("text", { class: "elabel", x: NW / 2, y: NH / 2 + 14, "text-anchor": "middle" });
    const r = (meta[id] && meta[id].role) || "";
    role.textContent = r.length > 30 ? r.slice(0, 29) + "…" : r;
    g.appendChild(role);
    graph.appendChild(g);
    nodeEls[id] = g;
  }
}

function clearGraph() {
  for (const k in nodeEls) nodeEls[k].classList.remove("on");
  for (const k in edgeEls) edgeEls[k].classList.remove("on");
}
function lightNode(id) { if (nodeEls[id]) nodeEls[id].classList.add("on"); }
function lightEdge(a, b) { const e = edgeEls[a + ">" + b]; if (e) e.classList.add("on"); return e; }

function pulse(a, b, ms) {
  return new Promise(res => {
    const e = lightEdge(a, b); if (!e) return res();
    const len = e.getTotalLength();
    const dot = S("circle", { class: "pulse", r: 4.5 });
    graph.appendChild(dot);
    const t0 = performance.now();
    (function step(t) {
      const k = Math.min(1, (t - t0) / ms);
      const p = e.getPointAtLength(k * len);
      dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y);
      if (k < 1) requestAnimationFrame(step);
      else { dot.remove(); res(); }
    })(t0);
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

let replayToken = 0;
async function replay(target) {
  const my = ++replayToken;
  clearGraph();
  const touches = (target.thread && target.thread.length) || (target.call && target.call.length) || 1;
  const stage = $("#stageline");
  const set = s => { if (my === replayToken) stage.textContent = s; };

  set("researching " + target.name + " …"); lightNode("research");

  lightNode("ranker"); set("ranking evidence by reliability + freshness");

  lightNode("targeter"); set("choosing the angle — " + (target.hook.channel || "channel"));
  await sleep(260);
  await pulse("targeter", "writer", 480); if (my !== replayToken) return;
  lightNode("writer");

  for (let i = 0; i < touches; i++) {
    if (my !== replayToken) return;
    set(`touch ${i + 1}/${touches} · writer → Personal Interface`);
    await pulse("writer", "twin", 620); if (my !== replayToken) return;
    lightNode("twin");
    const t = (target.thread && target.thread[i]) || {};
    const replied = t.reply || (target.call && target.call[i] && target.call[i].them);

  const r = 32, c = 2 * Math.PI * r;
  svg.appendChild(S("circle", { cx: 40, cy: 40, r, fill: "none", stroke: line, "stroke-width": 8 }));
  if (pct != null) {
    const arc = S("circle", { cx: 40, cy: 40, r, fill: "none", stroke: accent, "stroke-width": 8,
      "stroke-linecap": "round", "stroke-dasharray": c, "stroke-dashoffset": c * (1 - pct / 100),
      transform: "rotate(-90 40 40)" });
    svg.appendChild(arc);
  }
}

// ---- render target detail ----
function renderHook(t) {
  const kv = $("#hookkv"); kv.innerHTML = "";
  const rows = [["Angle", t.hook.topic], ["Why now", t.hook.why_now],
    ["Channel", t.hook.channel], ["Objective", t.objective]];
  for (const [k, v] of rows) {
    if (!v) continue;
    const row = el("div", "row"); row.appendChild(el("b", null, k));
    row.appendChild(el("span", null, v)); kv.appendChild(row);
  }
  const bars = $("#relbars"); bars.innerHTML = "";
  if (t.score) {
    lastPct = t.score.percent;
    drawRing(t.score.percent);
    $("#ringpct").textContent = t.score.percent + "%";
    for (const [rel, n] of Object.entries(t.score.breakdown))
      bars.appendChild(el("span", "r", `${n} ${rel}`));
    bars.appendChild(el("span", "r", `${t.score.evidence_count} cited facts`));
  } else {
    lastPct = null; drawRing(null); $("#ringpct").textContent = "—";
    bars.appendChild(el("span", "r", "no scored evidence in this run"));
  }
}

const PLAN_LABEL = { continue: "planner: continue", switch: "planner: switch angle", stop: "planner: stop" };
function renderThread(t) {
  const box = $("#thread"); box.innerHTML = "";
  const touches = t.thread || [];
  if (!touches.length && (!t.call || !t.call.length)) { box.appendChild(el("div", "empty", "No thread recorded for this run.")); return; }
  touches.forEach((m, i) => {
    const us = el("div", "msg us");
    const meta = el("div", "meta");
    meta.appendChild(el("span", "ch", m.channel || "msg"));
    if (m.from_name) meta.appendChild(el("span", null, m.from_name + (m.from_address ? " · " + m.from_address : "")));
    meta.appendChild(el("span", null, "touch " + (m.touch || i + 1)));
    us.appendChild(meta);
    if (m.subject) { const s = el("div"); s.style.fontWeight = "600"; s.style.fontSize = "13.5px"; s.style.marginBottom = "4px"; s.textContent = m.subject; us.appendChild(s); }
    us.appendChild(el("div", "bd", m.body || ""));
    box.appendChild(us);

    if (m.reply) {
      const them = el("div", "msg them");
      const tm = el("div", "meta"); tm.appendChild(el("span", null, t.name + " · twin")); them.appendChild(tm);
      them.appendChild(el("div", "bd", m.reply));
      box.appendChild(them);
    } else {
      box.appendChild(el("div", "silence", t.name + " stayed silent"));
    }
    if (m.plan && i < touches.length - 1) {
      const p = el("div", "plan");
      p.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="3"/></svg>';
      p.appendChild(el("b", null, (PLAN_LABEL[m.plan] || m.plan).replace("planner: ", "")));
      if (m.guidance) { const g = el("span"); g.textContent = m.guidance.length > 90 ? m.guidance.slice(0, 89) + "…" : m.guidance; g.title = m.guidance; p.appendChild(g); }
      box.appendChild(p);
    }
  });
  (t.call || []).forEach((turn, i) => {
    const head = el("div", "plan"); head.appendChild(el("b", null, "voice call"));
    if (i === 0) box.appendChild(head);
    const us = el("div", "msg us"); us.appendChild(el("div", "meta")).textContent = "caller"; us.appendChild(el("div", "bd", turn.us)); box.appendChild(us);
    const them = el("div", "msg them"); them.appendChild(el("div", "meta")).textContent = t.name + " · twin"; them.appendChild(el("div", "bd", turn.them)); box.appendChild(them);
  });
}

function renderSweep(t) {
  const host = $("#sweep"); host.innerHTML = "";
  const rows = t.sweep || [];
  $("#sweepn").textContent = rows.length ? rows.length + " tactics" : "";
  if (!rows.length) { host.appendChild(el("div", "empty", "No sweep recorded.")).style.padding = "16px"; return; }
  const tbl = el("table");
  tbl.innerHTML = "<thead><tr><th>Tactic</th><th>Lever</th><th>Channel</th><th>Result</th></tr></thead>";
  const tb = el("tbody");
  rows.forEach(r => {
    const tr = el("tr");
    tr.appendChild(el("td", null, (r.tactic || "").replace(/_/g, " ")));
    tr.appendChild(el("td", "cap", r.lever || ""));
    tr.appendChild(el("td", "cap", (r.channel || "").replace(/_/g, " ")));
    const td = el("td");
    const d = el("span", r.incident ? "dotok" : "dotno"); td.appendChild(d);
    const lab = el("span"); lab.style.marginLeft = "7px";
    lab.textContent = r.incident ? "incident" : (r.best || "silence");
    if (r.incident) { lab.style.color = "var(--accent)"; lab.style.fontWeight = "600"; } else lab.className = "cap";
    td.appendChild(lab); tr.appendChild(td);
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); host.appendChild(tbl);
}

function renderOutcome(t) {
  const o = $("#outcome"); o.innerHTML = "";
  const win = t.outcome.compromised;
  const b = el("span", "badge " + (win ? "b-win" : "b-held"));
  b.innerHTML = win
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>objective reached'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>target held';
  o.appendChild(b);
  const parts = [];
  if (t.outcome.touches) parts.push(t.outcome.touches + " touches");
  if (t.outcome.contact_incident) parts.push("message thread: incident");
  if (t.outcome.call_incident) parts.push("voice call: incident");
  const p = el("div"); p.style.marginTop = "10px"; p.style.color = "var(--muted)"; p.style.fontSize = "13px";
  p.textContent = win
    ? "Agent self-assessed an incident — " + parts.join(" · ") + ". Verify against the twin's verbatim replies above."
    : "No incident across " + (t.outcome.touches || 0) + " touches; the twin demanded sender verification and routed to its team.";
  o.appendChild(p);
}

// ---- target rail ----
let selected = null;
function select(t) {
  selected = t;
  document.querySelectorAll(".tcard").forEach(c => c.setAttribute("aria-selected", c.dataset.id === t.id));
  renderHook(t); renderThread(t); renderSweep(t); renderOutcome(t);
  replay(t);
}
function renderRail() {
  const rail = $("#rail"); rail.innerHTML = "";
  (DATA.targets || []).forEach(t => {
    const c = el("button", "tcard"); c.dataset.id = t.id; c.setAttribute("aria-selected", "false");
    const nm = el("div", "nm"); nm.appendChild(el("span", null, t.name));
    const badge = el("span", "badge " + (t.outcome.compromised ? "b-win" : "b-held"));
    badge.innerHTML = (t.outcome.compromised
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>compromised'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>held');
    nm.appendChild(badge); c.appendChild(nm);
    c.appendChild(el("div", "ob", (t.hook.channel ? t.hook.channel + " · " : "") + t.objective));
    c.onclick = () => select(t);
    rail.appendChild(c);
  });
}

// ---- boot ----
function boot() {
  $("#model").textContent = DATA.model || "model";
  const s = DATA.summary || {};
  $("#score").textContent = (s.compromised ?? 0) + " / " + (s.targets_total ?? 0);
  if (DATA.generated_at) { try { $("#time").textContent = new Date(DATA.generated_at).toLocaleString(); } catch (e) { $("#time").textContent = DATA.generated_at; } }
  $("#foot").textContent = (DATA.scenario || "") + "  —  Data is a privacy-safe export of real Target-API sessions; raw OSINT is not published.";
  buildGraph(); renderRail();
  if ((DATA.targets || []).length) select(DATA.targets.find(t => t.outcome.compromised) || DATA.targets[0]);
  else { $("#stageline").textContent = "No run data — run scripts/build_dashboard_data.py"; }
}
$("#replay").onclick = () => { if (selected) replay(selected); };
boot();
</script>
</body>
</html>
